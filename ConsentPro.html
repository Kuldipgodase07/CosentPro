<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ConsentPro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@200..600&display=swap">
<style>
/* Layout: sticky top bar with role switch, role-specific sidebar, one scrolling workspace.
   Palette: the six supplied gradient colours only; tints are mixes of them. */
:root{
  --c-mist:#F2E6EE; --c-pink:#FFCCF2; --c-lilac:#977DFF; --c-blue:#0033FF; --c-deep:#0600AB; --c-night:#00033D;
  --f: 'Google Sans Flex','Google Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:var(--c-mist);
  --surface:color-mix(in srgb,var(--c-mist) 42%,#fff);
  --surface-2:color-mix(in srgb,var(--c-mist) 78%,var(--c-lilac));
  --ink:var(--c-night);
  --ink-2:color-mix(in srgb,var(--c-night) 66%,var(--c-mist));
  --line:color-mix(in srgb,var(--c-night) 13%,var(--c-mist));
  --accent:var(--c-blue); --accent-ink:var(--c-mist);
  --accent-soft:color-mix(in srgb,var(--c-lilac) 24%,var(--c-mist));
  --hi:var(--c-pink); --hi-ink:var(--c-night);
  --chart-a:var(--c-blue); --chart-b:var(--c-night);
  --focus:var(--c-deep);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--c-night);
  --surface:color-mix(in srgb,var(--c-night) 84%,var(--c-deep));
  --surface-2:color-mix(in srgb,var(--c-night) 66%,var(--c-deep));
  --ink:var(--c-mist);
  --ink-2:color-mix(in srgb,var(--c-mist) 68%,var(--c-night));
  --line:color-mix(in srgb,var(--c-lilac) 24%,var(--c-night));
  --accent:var(--c-lilac); --accent-ink:var(--c-night);
  --accent-soft:color-mix(in srgb,var(--c-lilac) 20%,var(--c-night));
  --chart-a:var(--c-lilac); --chart-b:var(--c-pink); --focus:var(--c-pink); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--c-night);
  --surface:color-mix(in srgb,var(--c-night) 84%,var(--c-deep));
  --surface-2:color-mix(in srgb,var(--c-night) 66%,var(--c-deep));
  --ink:var(--c-mist);
  --ink-2:color-mix(in srgb,var(--c-mist) 68%,var(--c-night));
  --line:color-mix(in srgb,var(--c-lilac) 24%,var(--c-night));
  --accent:var(--c-lilac); --accent-ink:var(--c-night);
  --accent-soft:color-mix(in srgb,var(--c-lilac) 20%,var(--c-night));
  --chart-a:var(--c-lilac); --chart-b:var(--c-pink); --focus:var(--c-pink); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:400;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:-.01em;text-decoration:none;color:inherit}
.brand small{font-weight:300;color:var(--ink-2);font-size:12px;display:block;line-height:1;margin-top:2px;letter-spacing:.02em}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,var(--c-lilac),var(--c-blue) 55%,var(--c-deep));display:grid;place-items:center;color:var(--c-mist)}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.themes .seg button{padding:6px 9px}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:28px;max-width:1440px;margin:auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:4px}
.side .who{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:0 12px 8px;font-weight:500}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-weight:500;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.badge{margin-left:auto;background:var(--hi);color:var(--hi-ink);border-radius:999px;font-size:12px;font-weight:600;padding:1px 8px;min-width:22px;text-align:center}
.side .note{margin-top:18px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.side .note b{color:var(--ink);font-weight:500;display:block;margin-bottom:2px}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead h1{font-weight:300;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1.1}
.pagehead p{color:var(--ink-2);max-width:62ch;margin-top:6px}
.pagehead .spacer{flex:1}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card h2{font-size:16px;font-weight:600;letter-spacing:-.005em}
.card .sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.hero{border-radius:24px;padding:28px;color:var(--c-mist);background:linear-gradient(155deg,var(--c-lilac) -30%,var(--c-blue) 28%,var(--c-deep) 70%,var(--c-night) 118%);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;position:relative;overflow:hidden}
.hero h1{font-weight:200;font-size:clamp(34px,5vw,56px);line-height:1.04;letter-spacing:-.03em}
.hero p{color:color-mix(in srgb,var(--c-mist) 82%,var(--c-blue));margin-top:10px;max-width:50ch}
.hero .tag{display:inline-flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--c-pink) 18%,transparent);color:var(--c-pink);font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;margin-bottom:14px;letter-spacing:.03em}
.hero .ring text{fill:var(--c-mist)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.stat{padding:18px 20px}
.stat .k{font-size:13px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.stat .v{font-size:40px;font-weight:200;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.stat .v small{font-size:15px;font-weight:300;color:var(--ink-2);margin-left:4px;letter-spacing:0}
.stat .d{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:500}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}*{scroll-behavior:auto!important;transition:none!important}}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn--p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn--p:hover{filter:brightness(1.08)}
.btn--r{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.btn--sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tagx{display:inline-block;background:var(--surface-2);border-radius:8px;padding:2px 9px;font-size:12px;color:var(--ink-2);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill .ic{width:14px;height:14px;stroke-width:2.2}
.pill--granted{background:var(--accent);color:var(--accent-ink)}
.pill--revoked{background:var(--hi);color:var(--hi-ink)}
.pill--pending{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.pill--expired{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.pill--neutral{background:var(--surface-2);color:var(--ink-2)}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.bad td{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.scroll{overflow-x:auto}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* consent rows */
.org{display:flex;flex-direction:column;gap:0}
.orghead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.av{width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,var(--c-lilac),var(--c-deep));color:var(--c-mist);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.orghead b{font-weight:600}
.orghead span{display:block;color:var(--ink-2);font-size:13px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:14px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow h3{font-size:15px;font-weight:500}
.prow .meta{color:var(--ink-2);font-size:13px;margin-top:3px}
.prow .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prow .act{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.prow .act .row{justify-content:flex-end}

/* feeds & timeline */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.feed li:first-child{border-top:0}
.feed .t{color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:18px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.tl li.rev::before{background:var(--hi);outline:2px solid var(--ink-2)}
.tl b{font-weight:500}.tl small{display:block;color:var(--ink-2)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;max-height:440px;overflow:auto;padding:4px 2px}
.msg{max-width:min(560px,88%);padding:10px 14px;border-radius:16px;font-size:14.5px}
.msg.bot{background:var(--surface-2);border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg .row{margin-top:10px}

/* code */
pre.code{margin:0;background:var(--c-night);color:var(--c-mist);border-radius:14px;padding:16px;overflow:auto;font-size:12.5px;line-height:1.6;border:1px solid var(--line)}
pre.code .c{color:var(--c-lilac)}pre.code .s{color:var(--c-pink)}
.check{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check .ref{font-size:12px;color:var(--ink-2)}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--c-night) 62%,transparent);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}
.sheet h2{font-size:22px;font-weight:400;letter-spacing:-.01em}
.sheet .lead{color:var(--ink-2);margin-top:6px}
.sheet .box{background:var(--surface-2);border-radius:14px;padding:14px;margin-top:16px;font-size:14px}
.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.steps li.on{color:var(--ink)}
.steps .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.steps li.on .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps .dot .ic{width:12px;height:12px;stroke-width:3}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px;z-index:60;box-shadow:0 8px 30px color-mix(in srgb,var(--c-night) 40%,transparent)}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.demo{font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border-radius:8px;padding:3px 9px}
.banner{border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:500}
.banner--ok{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.banner--bad{background:var(--hi);color:var(--hi-ink)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--chart-a);vertical-align:middle;margin-right:6px;border-radius:2px}
.legend i.b{border-top:2px dashed var(--chart-b)}
svg text{font-family:var(--f)}

@media (max-width:1060px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .side .who,.side .note{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 14px;background:var(--surface);border:1px solid var(--line)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .top-in{flex-wrap:wrap;gap:10px}
  .themes{order:3}
}
@media (max-width:560px){.g4,.g2{grid-template-columns:minmax(0,1fr)}.prow{grid-template-columns:minmax(0,1fr)}.prow .act{align-items:flex-start}.brand small{display:none}.seg button{padding:7px 10px}.feed li{grid-template-columns:auto minmax(0,1fr)}.feed .t{display:none}}
/* ===== product shell, landing, auth ===== */
.wrap{max-width:1200px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.lnav .wrap{display:flex;align-items:center;gap:20px;padding-block:12px}
.lnav .links{display:flex;gap:4px;margin-left:12px}
.lnav .links button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:500;color:var(--ink-2);cursor:pointer;font-size:14px}
.lnav .links button:hover{background:var(--surface-2);color:var(--ink)}
.hero2{position:relative;overflow:hidden;color:var(--c-mist);background:linear-gradient(160deg,var(--c-lilac) -40%,var(--c-blue) 22%,var(--c-deep) 62%,var(--c-night) 112%)}
.hero2 .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center;padding-block:84px 96px}
.hero2 h1{font-weight:200;font-size:clamp(40px,6vw,76px);line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
.hero2 h1 b{font-weight:600;color:var(--c-pink)}
.hero2 .lead{font-size:18px;font-weight:300;max-width:52ch;margin-top:20px;color:color-mix(in srgb,var(--c-mist) 86%,var(--c-blue))}
.hero2 .tag{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--c-pink) 16%,transparent);color:var(--c-pink);font-size:13px;font-weight:500;padding:6px 14px;border-radius:999px;margin-bottom:22px}
.btn--xl{padding:14px 26px;font-size:16px;border-radius:14px}
.btn--ghost{background:transparent;color:var(--c-mist);border-color:rgba(242,230,238,.45)}
.btn--ghost:hover{border-color:var(--c-pink)}
.rcard{background:color-mix(in srgb,var(--c-night) 55%,transparent);border:1px solid rgba(242,230,238,.2);border-radius:24px;padding:22px;backdrop-filter:blur(10px);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.rcard .rrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(242,230,238,.16)}
.rcard .rrow:first-of-type{border-top:0}
.rcard .rrow div{flex:1;min-width:0}
.rcard small{display:block;font-weight:300;opacity:.75}
.sw{width:42px;height:24px;border-radius:99px;background:rgba(242,230,238,.28);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--c-mist);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--c-lilac)}.sw[aria-checked="true"]::after{transform:translateX(18px)}

async function sha(str) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');

    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }

    return ((h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0')).repeat(4);

function chartSVG() {
  const W = 700, H = 400, pl = 44, pr = 16, pt = 14, pb = 30, n = 14;
  let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = Array.from({length: n}, (_, i) => Math.round(3100 + i * 70 + Math.sin(i / 1.6) * 380 + r() * 260));
  const v = Array.from({length: n}, (_, i) => Math.round(150 + Math.cos(i / 2) * 36 + r() * 40));
  g[n - 1] = S.stats.grants; v[n - 1] = S.stats.revokes;
  const max = 6000, x = i => pl + i * (W - pl - pr) / (n - 1), y = val => pt + (1 - val / max) * (H - pt - pb);

  const ticks = [0, 2000, 4000, 6000];
  const lab = i => fmtD(NOW - (n - 1 - i) * DAY).replace(/ 20\d\d$/, '');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grants and revocations, last 14 days" style="display:block;max-width:100%">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${y(t)}" text-anchor="end" dominant-baseline="central" font-size="11" fill="var(--ink-2)">${t ? t / 1000 + 'k' : 0}</text>`).join('')}
    <path d="${gl} L${x(n - 1)} ${y(0)} L${x(0)} ${y(0)}Z" fill="var(--chart-a)" opacity=".14"/>

service cloud.firestore {

    function hasRole(roles) { return signedIn() && request.auth.token.role in roles; }

    match /users/{uid} {
      allow read: if signedIn() && (request.auth.uid == uid || hasRole(['admin']));
      allow write: if false;
    }

    match /principals/{pid}/consents/{purposeId} {
      allow read: if signedIn() && request.auth.uid == pid;

    case 'chat-confirm': if (S.pending) { const p = byId(S.pending.id), r = applyConsent(S.pending.id, S.pending.do); say(`Done. “${esc(p.name)}” is now <b>${S.pending.do === 'revoke' ? 'revoked' : 'granted'}</b>. Receipt <span class="mono">${r}</span>.`); S.pending = null; render(); } return;
    case 'chat-cancel': S.pending = null; say('No change made.'); return render();
    case 'copy-snip': return copy($('#snip').textContent, 'Code copied');
    case 'run-verify': {
      const p = byId($('#apip').value), t0 = performance.now(); await new Promise(r => setTimeout(r, rnd(60, 130)));
      const ok = stat(p) === 'granted', ms = Math.round(performance.now() - t0); S.lat.push(ms); addEntry({type:'VERIFY', org:'orbit', purpose:p.name, subject:SUBJ, receipt:p.receipt});
      S.apiOut = JSON.stringify({allowed:ok, purpose:p.id, status:stat(p), receipt:p.receipt, evaluated_in_ms:ms}, null, 2).replace(/"([a-z_]+)":/g, '<span class="c">"$1"</span>:'); const o = $('#apiout'); if (o) o.innerHTML = S.apiOut; return;
    }
    case 'comp-done': if (!can('purposes')) return toast('Only a DPO or admin can change this.'); S.comp.find(c => c.id === id).state = 'done'; return render();
    case 'verify': if (!can('verify')) return toast('Your role cannot run verification.'); t.disabled = true; await verifyChain(); render(); return toast(S.verified.ok ? 'Chain verified' : 'Chain broken at #' + S.verified.at);
    case 'tamper': {
      if (!can('verify')) return toast('Your role cannot run this test.'); await chainP;
      if (S.tamper) { const e = S.ledger.find(x => x.seq === S.tamper); Object.assign(e, S.backup); S.tamper = null; S.backup = null; S.verified = null; }
      else { const e = S.ledger[Math.floor(S.ledger.length / 2)]; S.backup = {org:e.org, purpose:e.purpose}; S.tamper = e.seq; e.org = 'telco'; e.purpose = 'Altered after the fact'; S.verified = null; }
      return render();
    }
    case 'copy-bundle': return copy(JSON.stringify({exported:new Date().toISOString(), entries:S.ledger.length, head:S.ledger[S.ledger.length - 1]?.hash, ledger:S.ledger.slice(-50)}, null, 2), 'Evidence bundle copied');
    case 'req': { const r = S.requests.find(x => x.id === id); r.status = d.to; if (r.by === SUBJ) notify(['principal'], `Your request ${r.id} is now ${d.to.toLowerCase()}.`); toast(r.id + ' is ' + d.to.toLowerCase()); return render(); }
    case 'selp': S.sel = id; return render();
    case 'nstat': S.nstat[d.k] = d.v === 'ok' ? 'draft' : 'ok'; return render();
    case 'keyrev': S.keys.find(k => k.id === id).status = 'revoked'; toast('Key revoked. It stops working immediately.'); return render();
    case 'copykey': return copy(d.v, 'Key copied');
    case 'hooktest': { const ms = Math.round(rnd(80, 240)); S.deliv.unshift({code:200, event:'consent.revoked (test)', ms}); toast('Test delivered, 200 in ' + ms + ' ms'); return render(); }
    case 'runtests': {
      if (!can('tests')) return; S.running = true; S.tests = SUITES.map(() => null); render();
      for (let i = 0; i < SUITES.length; i++) { S.tests[i] = {done:false}; if (S.route === 'o-tests') render(); await new Promise(r => setTimeout(r, 420)); const n = SUITES[i][2].length, w = i === 4 ? 1 : 0; S.tests[i] = {done:true, pass:n - w, warn:w, warnAt:2, ms:Math.round(rnd(180, 900))}; }
      S.running = false; if (S.route === 'o-tests') render(); return toast('Suites finished');
    }
    case 'tsel': S.testSel = +d.i; return render();
    case 'accept': { const u = S.users.find(x => x.email === d.email); u.status = 'Active'; u.last = 'just now'; return render(); }
    case 'rmuser': S.users = S.users.filter(x => x.email !== d.email); toast('Member removed'); return render();
    case 'goreq': S.rtype = d.t; return go('c-requests');
    case 'board': return copy(`Board summary · ${S.tenant.name} · ${new Date().toDateString()}\nDPDP readiness ${score()}%\nActive consents ${S.stats.active}\nRights requests open ${S.requests.filter(r => r.status !== 'Resolved').length}\nObligations ready ${obligations().filter(o => o[3] === 'done').length} of ${obligations().length}\nRevocation avg ${S.stats.prop.toFixed(1)} s`, 'Board summary copied');
    case 'sample': { await chainP; const pool = [...S.ledger].sort(() => Math.random() - .5).slice(0, 25); S.sample = []; for (const e of pool) S.sample.push({...e, ok: (await sha(canon(e))) === e.hash}); toast('Sample of ' + S.sample.length + ' drawn'); return render(); }
    case 'setmfa': S.settings.mfa = !S.settings.mfa; return render();
    case 'lang': { const l = d.l, a2 = S.settings.langs; S.settings.langs = a2.includes(l) ? (a2.length > 1 ? a2.filter(x => x !== l) : a2) : [...a2, l]; return render(); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pick) { S.noticePick[t.dataset.pick] = t.checked; render(); }
  else if (t.id === 'ft') { S.ftype = t.value; const b = $('#lbody'); if (b) b.innerHTML = ledgerRows(); }
  else if (t.dataset.perm) { const r = t.dataset.prole, p = t.dataset.perm, a = ROLE_PERMS[r]; ROLE_PERMS[r] = t.checked ? [...new Set([...a, p])] : a.filter(x => x !== p); toast(`${ROLES[r].n}: ${PERMS[p]} ${t.checked ? 'allowed' : 'removed'}`); render(); }
  else if (t.dataset.set) { S.settings[t.dataset.set] = t.value; toast('Saved'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; const b = $('#lbody'); if (b) b.innerHTML = ledgerRows(); }
  else if (t.id === 'sp') { const s = strength(t.value); $$('#str i').forEach((i, k) => i.classList.toggle('on', k < s)); }
  else if (t.id === 'cmdq') { cmdSel = 0; drawCmd(t.value); }
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const id = e.target.id, v = k => $('#' + k).value.trim();
  if (id === 'loginform') return doLogin(v('le'), $('#lp').value);
  if (id === 'signupform') return doSignup();
  if (id === 'mfaform') { if (v('code') === '482913') return login(S.mfa); S.authErr = 'That code is not right. Use 482913 in this demo.'; return render(); }
  if (id === 'chatform') { const i = $('#chatin'), x = i.value.trim(); if (x) { handleChat(x); render(); $('#chatin').focus(); } return; }
  if (id === 'pform') { const p = P('n' + Date.now(), 'orbit', v('pn'), v('pd'), v('pc').split(',').map(s => s.trim()).filter(Boolean), $('#pr').value, 'pending', null, []); p.rate = 0; p.count = 0; S.purposes.push(p); notify(['principal'], `${ORGS.orbit.name} sent you a consent request: ${p.name}.`); toast('Purpose published. The sample citizen has a new request.'); return render(); }
  if (id === 'rform') { const n = 1044 + S.requests.filter(r => r.by === SUBJ).length; S.requests.push({id:'RQ-' + n, type:$('#rt').value, by:SUBJ, text:v('rd'), ts:Date.now(), due:Date.now() + 30 * DAY, status:'Open'}); notify(['dpo','admin'], `New ${$('#rt').value.toLowerCase()} request RQ-${n} from ${SUBJ}.`); toast('Request sent. Due in 30 days.'); return render(); }
  if (id === 'kform') {
    const name = v('kn'); if (!name) return toast('Give the key a name.'); const scopes = $$('input[name=ks]:checked').map(x => x.value); if (!scopes.length) return toast('Choose at least one scope.');
    const full = 'cp_live_' + hex(32); S.keys.push({id:'k' + Date.now(), name, prefix:full.slice(0, 12), scopes, created:Date.now(), last:'never', status:'active'}); notify(['dev','admin'], `API key “${name}” was created.`);
    S.modal = {type:'key'}; const m = $('#modal'); m.hidden = false; m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h2>Copy your key now</h2><p class="lead">This is the only time the full key is shown.</p><div class="box mono" style="word-break:break-all">${full}</div><div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" data-act="copykey" data-v="${full}">${ic('copy')}Copy</button><button class="btn btn--p" data-act="close">I have stored it</button></div></div>`; return;
  }
  if (id === 'hform') { const u = v('hu'); if (!/^https:\/\/\S+\.\S+/.test(u)) return toast('Enter a full https:// address.'); S.hooks.push({id:'w' + Date.now(), url:u, events:['consent.revoked','consent.granted'], status:'active'}); return render(); }
  if (id === 'iform') { const n = v('in'), em = v('ie'); if (!n || !/^\S+@\S+\.\S+$/.test(em)) return toast('Enter a name and a valid email.'); if (S.users.some(u => u.email.toLowerCase() === em.toLowerCase())) return toast('That email is already a member.'); S.users.push({name:n, email:em, role:$('#ir').value, status:'Invited', last:'–', mfa:true, added:true, pw:await hashPw(em, PW)}); toast('Invite sent to ' + em); return render(); }
  if (id === 'sform') { S.tenant.name = v('tn') || S.tenant.name; ORGS.orbit.name = S.tenant.name; Object.assign(S.settings, {dpo:v('td'), dpoMail:v('tm'), retention:$('#tr').value, region:$('#tg').value}); S.tenant.region = (S.settings.region === 'Mumbai' ? 'Mumbai · asia-south1' : 'Delhi · asia-south2'); toast('Settings saved'); return render(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && S.user) { e.preventDefault(); return openCmd(); }
  if (e.key === 'Escape') { closeCmd(); closePop(); $('#drawer').hidden = true; closeModal(); }
  if (!$('#cmd').hidden && ['ArrowDown','ArrowUp','Enter'].includes(e.key)) { e.preventDefault(); if (e.key === 'Enter') { const it = cmdList[cmdSel]; closeCmd(); return it && it.run(); } cmdSel = (cmdSel + (e.key === 'ArrowDown' ? 1 : -1) + cmdList.length) % Math.max(1, cmdList.length); drawCmd($('#cmdq').value); }
});
async function copy(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg); } catch (e) { toast('Copy is blocked here. Select the text and copy it.'); } }
function applyTheme() { const r = document.documentElement; if (S.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme); try { localStorage.setItem('cp-theme', S.theme); } catch (e) {} }
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if ((PUBLIC.includes(r) || R[r]) && r !== S.route) go(r); });

try { const t = localStorage.getItem('cp-theme'); if (t) { S.theme = t; applyTheme(); } } catch (e) {}
(async () => {
  await seedUsers();
  try { const em = sessionStorage.getItem('cp-session'); const u = em && S.users.find(x => x.email === em); if (u) S.user = u; } catch (e) {}
  const r = location.hash.slice(1); S.route = (PUBLIC.includes(r) || R[r]) ? r : 'home';
  if (!PUBLIC.includes(S.route) && !S.user) { S.next = S.route; S.route = 'login'; }
  render();
  await seedLedger(); S.feed = S.ledger.filter(e => e.org === 'orbit').slice(-8).reverse(); if (S.route === 'o-dash' || S.route === 'a-ledger') render();
  setInterval(tick, 2600);
})();
</script>
